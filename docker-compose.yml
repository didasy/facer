services:
  biometric-verification:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biometric_verification_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      - PORT=8000
      - WORKERS=2
      - MODEL_DIR=/app/models
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      # Face-ROI blur gate (calibrated 2026-09-15: sharp ROI ~553, slight-blur ~53, heavy-blur 4-16)
      - BLUR_THRESHOLD=${BLUR_THRESHOLD:-25.0}
      - BLUR_SCORE_MAX=${BLUR_SCORE_MAX:-250.0}
      - FACE_PAD_RATIO=${FACE_PAD_RATIO:-0.25}
      # RetinaFace-R34 detection (max-side cap)
      - DET_THRESHOLD=${DET_THRESHOLD:-0.5}
      - DET_INPUT_SIZE=${DET_INPUT_SIZE:-640}
      # EdgeFace verification
      - VERIFY_THRESHOLD=${VERIFY_THRESHOLD:-0.60}
      # FaceAttribNet attributes + MiniFASNetV2 liveness
      - ATTRIB_THRESHOLD=${ATTRIB_THRESHOLD:-0.6}
      - EYE_CLOSED_THRESHOLD=${EYE_CLOSED_THRESHOLD:-0.6}
      - MINIFAS_SCALE=${MINIFAS_SCALE:-2.7}
      # In-memory concurrency gate: max in-flight POST /api/v1/verify per worker
      - MAX_QUEUED_REQUESTS=${MAX_QUEUED_REQUESTS:-10}
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2048M
        reservations:
          cpus: '1.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
